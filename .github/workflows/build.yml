name: Build & Release APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # softprops/action-gh-release 需要 release write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Read version from gradle
        id: ver
        run: |
          NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v${NAME}+${CODE}" >> "$GITHUB_OUTPUT"
          echo "::notice::Building $NAME (code $CODE) → tag v${NAME}+${CODE}"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Publish GitHub Release (only on push to main)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: v${{ steps.ver.outputs.name }}
          body: |
            Automated build of commit ${{ github.sha }}.

            APK: `app-release.apk` (debug-key signed; merge install over previous version).
          files: app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
          make_latest: "true"

      - name: Prune old releases (keep latest 5)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --repo "${{ github.repository }}" --limit 200 --json tagName,createdAt \
            | jq -r 'sort_by(.createdAt) | reverse | .[5:] | .[].tagName' \
            | while read -r tag; do
                [ -z "$tag" ] && continue
                echo "Deleting old release $tag"
                gh release delete "$tag" --repo "${{ github.repository }}" --cleanup-tag --yes || true
              done

      - name: Upload lint reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-and-build-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
            app/build/intermediates/lint_vital_intermediate_text_report/
            app/build/intermediates/lint_intermediate_text_report/
          if-no-files-found: ignore
          retention-days: 7
